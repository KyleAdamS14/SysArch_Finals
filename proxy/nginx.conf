# Single public entry point. Only this container publishes a port to the host.
server {
    listen 8080;

    # Web pages
    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
    }

    # Team CRUD API (module: team-api, backed by PostgreSQL)
    location /api/pokemon {
        proxy_pass http://team-api:3000;
        proxy_set_header Host $host;
    }

    # PokeAPI lookup (module: lookup-service)
    location /api/lookup {
        proxy_pass http://lookup-service:4000;
        proxy_set_header Host $host;
    }
}
